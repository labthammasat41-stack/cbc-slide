<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ตาม Slide CBC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* ธีมสว่างแบบห้องปฏิบัติการ: พื้นขาว-ฟ้าอ่อน ตัวอักษรน้ำเงินเข้ม สีหลักเขียวน้ำทะเล (ส่งใบตาม) และน้ำเงิน (รับสไลด์) */
:root{
  color-scheme:light;
  --bg:#eef3f7; --surface:#ffffff; --ink:#102a43; --muted:#52677d; --line:#d6e1ea; --field:#f7fafc;
  --teal:#0b7a75; --teal-soft:#e1f3f1; --blue:#1f5fae; --blue-soft:#e7eff9; --violet:#5a45a8; --violet-soft:#efecfa;
  --ok:#1a7f4b; --ok-soft:#e3f4ea; --warn:#a85300; --warn-soft:#fff3df; --bad:#b42318; --bad-soft:#fdeceb;
  --shadow:0 1px 2px rgba(16,42,67,.06),0 4px 14px rgba(16,42,67,.06);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{font-size:calc(16px * var(--fs,1.12))}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25}
h2{font-size:1.2rem} h3{font-size:1rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.muted{color:var(--muted)} .small{font-size:.85rem}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* header */
.head{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--teal);margin-bottom:16px}
.head-in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mark{width:40px;height:40px;border-radius:10px;background:var(--teal-soft);display:grid;place-items:center;flex:none}
.mark svg{width:24px;height:24px;color:var(--teal)}
.brand h1{font-size:1.3rem;color:var(--ink)}
.brand .org{font-size:.82rem;color:var(--muted);line-height:1.35}
.head-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fs{display:flex;align-items:center;gap:2px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px}
.fs-l{font-size:.78rem;color:var(--muted);margin-right:4px}
.fs button{border:0;background:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-weight:700;color:var(--muted);font-family:var(--f-display);line-height:1}
.fs button[aria-pressed="true"]{background:var(--teal);color:#fff}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

main{padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.col{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wide{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-weight:600;font-size:.95rem}
.hint{font-size:.8rem;color:var(--muted)}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);font-size:1rem;min-width:0}
.input:focus{border-color:var(--blue);background:#fff;outline:none}
.daychips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.daychip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-weight:600;font-size:1rem;cursor:pointer;color:var(--ink)}
.daychip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.timein{font-size:1.25rem;letter-spacing:.08em;max-width:220px}
.input.bad{border-color:var(--bad);background:var(--bad-soft)}
.input.static{background:var(--bg);color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scanrow{display:flex;gap:8px}.scanrow .input{flex:1}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-teal{background:var(--teal);color:#fff}.btn-blue{background:var(--blue);color:#fff}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:wait}
.btn-block{width:100%;padding:15px;font-size:1.05rem}
.cam{flex:none;width:56px;background:var(--blue);color:#fff;border-radius:10px;border:0;cursor:pointer;display:grid;place-items:center}
.cam svg{width:26px;height:26px}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;padding:4px 0;font-size:.88rem;text-decoration:underline;align-self:flex-start}

.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border:0;border-radius:16px;padding:20px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;min-height:140px;color:#fff;box-shadow:var(--shadow)}
.big svg{width:30px;height:30px;opacity:.95}
.big b{font-family:var(--f-display);font-size:1.15rem;line-height:1.3}
.big span{font-size:.82rem;opacity:.9}
.big.send{background:var(--teal)}.big.recv{background:var(--blue)}
.big.inc{background:var(--violet);grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px;padding:16px}
.big.inc .t{display:flex;flex-direction:column;gap:2px}
.btn-violet{background:var(--violet);color:#fff}
.dt{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.opt{font-weight:400;color:var(--muted);font-size:.85rem}
.flags{display:flex;flex-direction:column;gap:6px}
.flag{font-size:.85rem;padding:6px 10px;border-radius:8px}
.rule{font-size:.85rem;padding:8px 12px;border-radius:8px;background:var(--blue-soft);color:var(--blue)}.rule.bad{background:var(--bad-soft);color:var(--bad)}.rule.warn{background:var(--warn-soft);color:var(--warn)}
.flag.ok{background:var(--ok-soft);color:var(--ok)}.flag.warn{background:var(--warn-soft);color:var(--warn)}.flag.bad{background:var(--bad-soft);color:var(--bad)}
.tag-inc{display:inline-block;font-size:.72rem;font-weight:600;color:var(--violet);background:var(--violet-soft);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}

.me{display:flex;justify-content:space-between;gap:10px;align-items:center}
.me-info{display:flex;gap:12px;align-items:center;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}

.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;z-index:5;box-shadow:0 10px 28px rgba(16,42,67,.14);padding:4px;margin:0;list-style:none}
.combo-list li{padding:10px 12px;border-radius:8px;cursor:pointer}
.combo-list li[aria-selected="true"],.combo-list li:hover{background:var(--blue-soft)}

.check{border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff}
.check.ok{border-color:var(--blue)}
.ward-big{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-in{background:var(--warn-soft);color:var(--warn)}.st-out{background:var(--ok-soft);color:var(--ok)}
.dupcard{border:2px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dupcard h3{color:var(--warn)}.dupcard .kv dd{font-weight:600}

.done{text-align:center;align-items:center}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.time{font-family:var(--f-mono);font-size:1.5rem}
.mylist .it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.mylist .it:first-child{border-top:0}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:520px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.stat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stat .n{font-family:var(--f-display);font-size:1.8rem;font-weight:700;line-height:1}.stat .l{font-size:.82rem;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar .input{max-width:320px}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:880px;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--field)}
tr:last-child td{border-bottom:0}
.late{color:var(--bad);font-weight:600}
.alert{padding:12px 14px;border-radius:10px;font-size:.92rem}
.alert{white-space:pre-line}.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.ok{background:var(--ok-soft);color:var(--ok)}.alert.info{background:var(--blue-soft);color:var(--blue)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:.92rem;z-index:30;max-width:calc(100% - 32px)}
.loading{text-align:center;color:var(--muted);padding:40px 0}

.scan-ov{position:fixed;inset:0;background:rgba(10,24,40,.92);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;color:#fff}
#reader{width:min(100%,460px);border-radius:12px;overflow:hidden;background:#000}
.scan-ov .msg{text-align:center;font-size:.92rem;max-width:420px}
.scan-ov .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.scan-ov .btn-ghost{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.zoom{display:flex;align-items:center;gap:10px;width:min(100%,460px);font-size:.9rem}
.zoom input{flex:1;accent-color:#5ff0de;height:28px}
.photo-btn{background:#fff;color:var(--ink)}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,24,40,.55);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-box{position:relative;background:#fff;border-radius:18px;width:100%;max-width:460px;max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(10,24,40,.35)}
.modal-x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(16,42,67,.08);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:2}
.modal-head{background:var(--teal);color:#fff;padding:22px 56px 18px 20px;border-radius:18px 18px 0 0}
.modal-head h2{font-size:1.25rem}.modal-head p{margin:4px 0 0;font-size:.88rem;opacity:.9}
.modal-head.help{background:var(--ink)}
.modal-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;counter-increment:st}
.steps li::before{content:counter(st);width:32px;height:32px;border-radius:50%;background:var(--teal-soft);color:var(--teal);font-family:var(--f-display);font-weight:700;display:grid;place-items:center}
.steps b{display:block}
.steps .small{color:var(--muted)}
.incident{border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 14px;font-size:.92rem;font-weight:600}
.help-sec{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.help-sec h3{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.help-sec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.help-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
.help-btn svg{width:20px;height:20px;color:var(--blue)}
.page-head{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.back-btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:9px 18px 9px 12px;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.back-btn svg{width:22px;height:22px}
.back-btn:active{background:var(--bg)}
.pending{border:2px solid var(--blue);background:var(--blue-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pending h3{color:var(--blue)}
.pending .kv dd{font-weight:600}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools .help-btn{font-size:.92rem;padding:12px 8px}
.res{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#fff}
.res.out{border-color:var(--ok)}.res.in{border-color:var(--warn)}
.res .big-st{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.res.out .big-st{color:var(--ok)}.res.in .big-st{color:var(--warn)}
.msg .go{margin-top:8px}
/* น้องสไลด์ */
.guide-top{display:flex;gap:12px;align-items:flex-end;padding:20px 56px 0 16px;background:linear-gradient(180deg,var(--teal-soft),#fff);border-radius:18px 18px 0 0}
.guide-top .bot{width:96px;flex:none}
.guide-top .say{position:relative;background:#fff;border:2px solid var(--teal);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:.92rem;line-height:1.5;margin-bottom:40px}
.guide-top .say b{font-family:var(--f-display);color:var(--teal);font-size:1.05rem;display:block}
.bot{display:block;height:auto}
.fab{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:4px;z-index:20;pointer-events:none}
.fab>*{pointer-events:auto}
.fab-say.quiet{display:none}
.fab-say{background:#fff;border:2px solid var(--teal);color:var(--ink);font-weight:600;font-size:.88rem;padding:7px 12px;border-radius:14px 14px 4px 14px;box-shadow:0 6px 18px rgba(16,42,67,.15);margin-bottom:52px;max-width:200px;cursor:pointer}
.fab-bot{border:0;background:none;padding:0;cursor:pointer;width:76px}
.fab-bot .bot{width:100%;filter:drop-shadow(0 6px 10px rgba(16,42,67,.22))}
main{padding-bottom:140px!important}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg .av{width:40px;flex:none}
.msg .txt{background:var(--teal-soft);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:.93rem;line-height:1.6;white-space:pre-line}
.msg.me{justify-content:flex-end}
.msg.me .txt{background:var(--blue);color:#fff;border-radius:14px 14px 4px 14px}
.chips{display:flex;flex-direction:column;gap:6px}
.chips h4{margin:6px 0 0;font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.chip{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-size:.9rem;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--teal);background:var(--teal-soft)}
.call{display:inline-block;font-family:var(--f-mono);font-weight:600;color:var(--teal)}
@media (prefers-reduced-motion:no-preference){
  .bob{animation:bob 2.4s ease-in-out infinite}
  .bot .wave{animation:wave 1.4s ease-in-out infinite;transform-box:view-box;transform-origin:34px 100px}
  .bot .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
  .fab-say{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both .4s}
}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(16deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* photo evidence */
.photo-box{display:flex;flex-direction:column;gap:8px}
.photo-take{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:18px;background:var(--field);color:var(--blue);font-weight:600;cursor:pointer;text-align:center}
.photo-take svg{width:26px;height:26px}
.photo-prev{display:flex;gap:12px;align-items:center}
.photo-prev img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none}
@media (max-width:420px){.brand h1{font-size:1.15rem}.big b{font-size:1.05rem}}
@media (max-width:360px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="head"><div class="head-in">
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M8 8v8"/><circle cx="14.5" cy="12" r="2"/></svg></div>
    <div style="min-width:0"><h1>ตาม Slide CBC</h1><div class="org">ห้องปฏิบัติการเทคนิคการแพทย์ โรงพยาบาลธรรมศาสตร์</div></div>
  </div>
  <div class="head-tools">
  <div class="fs" role="group" aria-label="ขนาดตัวหนังสือ">
    <span class="fs-l">ตัวหนังสือ</span>
    <button data-fs="1" aria-label="ตัวหนังสือปกติ" style="font-size:.85rem">ก</button>
    <button data-fs="1.12" aria-label="ตัวหนังสือใหญ่" style="font-size:1.05rem">ก</button>
    <button data-fs="1.28" aria-label="ตัวหนังสือใหญ่มาก" style="font-size:1.3rem">ก</button>
  </div>
  <div class="seg" role="group" aria-label="สลับมุมมอง">
    <button id="mode-ward" aria-pressed="true">เจ้าหน้าที่</button>
    <button id="mode-lab" aria-pressed="false">ภาพรวมห้องปฏิบัติการ</button>
  </div>
  </div>
</div></header>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="nong" viewBox="0 0 120 140">

<script>
(function(){
const TOKEN_KEY='cbcSlideToken', WARD_KEY='cbcLastWard';
const STATUS={in:'ส่งใบตามแล้ว รอรับ',out:'รับสไลด์แล้ว'};
let WARDS=[], ME=null, LATE_MIN=30, mode='ward', view='home', lastDone=null, labPin='', labRows=[], labFilter='in', labQ='';

// ลิงก์ /exec ของ Apps Script (ตัวรับข้อมูลที่บันทึกลง Google Sheets)
const API_URL='https://script.google.com/macros/s/AKfycbyqxxgojW1ClbxC3L49933YuOZxhVTChcOFa1aWwIeeKNhaBQT0Ettu6fheGU02S_Ex8g/exec';
async function run(fn,...args){
  let res;
  try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow'})}
  catch(e){throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่')}
  let j;try{j=await res.json()}catch(e){throw new Error('ระบบตอบกลับผิดรูปแบบ ตรวจว่าอัปเดตโค้ด Apps Script และทำให้ใช้งานได้เป็นเวอร์ชันใหม่แล้ว')}
  if(!j.ok)throw new Error(j.error||'เกิดข้อผิดพลาด');
  return j.data;
}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pill=st=>`<span class="pill st-${st}">${STATUS[st]||st}</span>`;

function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function busy(btn,on,label){if(!btn)return;btn.disabled=on;if(on){btn.dataset.l=btn.textContent;btn.textContent=label||'กำลังบันทึก…'}else if(btn.dataset.l)btn.textContent=btn.dataset.l}
const camIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>';
const icSend='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>';
const icRecv='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M8 8v8"/><path d="M13 12l2 2 4-4"/></svg>';

/* ---------- live camera scanner ---------- */
let qr=null, scanTarget=null;
const FORMATS=()=>window.Html5QrcodeSupportedFormats?[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.CODABAR,Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.QR_CODE]:undefined;
// อ่านค่าเดียวกันได้ 2 ครั้งติดกันจึงยอมรับ กันอ่านเลขเพี้ยนจากภาพเบลอ
let lastCode='',lastHits=0,lastAt=0;
function onDecode(text){
  text=String(text).trim();const now=Date.now();
  if(text===lastCode&&now-lastAt<2000)lastHits++;else{lastCode=text;lastHits=1}
  lastAt=now;
  if(lastHits>=2)gotCode(text);else $('#scan-msg').textContent='เจอบาร์โค้ดแล้ว ถือนิ่งอีกนิดครับ…';
}
function gotCode(text){
  if(!scanTarget)return;
  scanTarget.value=String(text).trim();
  scanTarget.dispatchEvent(new Event('input',{bubbles:true}));
  if(navigator.vibrate)navigator.vibrate(80);
  closeScanner();
}
const newReader=()=>new Html5Qrcode('reader',{formatsToSupport:FORMATS(),verbose:false,
  experimentalFeatures:{useBarCodeDetectorIfSupported:true}});   // ใช้ตัวอ่านบาร์โค้ดของมือถือเองถ้ามี (แม่นและเร็วกว่า)
async function openScanner(target){
  scanTarget=target;lastCode='';lastHits=0;
  $('#scan-ov').hidden=false;$('#zoom-box').hidden=true;$('#torch').hidden=true;
  $('#scan-msg').textContent='กำลังเปิดกล้อง…';
  if(!window.Html5Qrcode){$('#scan-msg').textContent='โหลดตัวอ่านบาร์โค้ดไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่ หรือพิมพ์เลขเอง';return}
  const cfg={fps:15,aspectRatio:1.333,
    qrbox:(w,h)=>({width:Math.floor(w*0.92),height:Math.max(80,Math.floor(h*0.38))}),
    videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]}};
  try{
    qr=newReader();
    try{await qr.start({facingMode:'environment'},cfg,onDecode,()=>{})}
    catch(e1){delete cfg.videoConstraints;qr=newReader();await qr.start({facingMode:'environment'},cfg,onDecode,()=>{})}
    $('#scan-msg').textContent='วางบาร์โค้ดแนวนอนให้เต็มกรอบ ห่างประมาณ 10–15 ซม. ถ้าบาร์โค้ดเล็ก ให้ใช้แถบซูม';
    setupCamExtras();
  }catch(e){
    $('#scan-msg').textContent='เปิดกล้องสดไม่ได้ ('+(e&&e.name||'ไม่ได้รับอนุญาต')+') กด "ถ่ายรูปบาร์โค้ดแทน" หรือปิดแล้วพิมพ์เลขเอง';
  }
}
// ซูมและไฟฉาย (ถ้ามือถือรองรับ)
function setupCamExtras(){
  let caps=null;try{caps=qr.getRunningTrackCameraCapabilities()}catch(e){return}
  try{const z=caps.zoomFeature();
    if(z.isSupported()){const r=$('#zoom');r.min=z.min();r.max=Math.min(z.max(),5);r.step=z.step()||0.1;
      const start=Math.min(2,+r.max);r.value=start;z.apply(start).catch(()=>{});$('#zoom-v').textContent=(+start).toFixed(1)+'x';
      r.oninput=()=>{z.apply(+r.value).catch(()=>{});$('#zoom-v').textContent=(+r.value).toFixed(1)+'x'};$('#zoom-box').hidden=false}}catch(e){}
  try{const t=caps.torchFeature();
    if(t.isSupported()){let on=false;const b=$('#torch');b.hidden=false;b.textContent='🔦 เปิดไฟฉาย';
      b.onclick=()=>{on=!on;t.apply(on).catch(()=>{});b.textContent=on?'🔦 ปิดไฟฉาย':'🔦 เปิดไฟฉาย'}}}catch(e){}
}
async function closeScanner(){
  $('#scan-ov').hidden=true;
  if(qr){try{if(qr.isScanning)await qr.stop();qr.clear()}catch(e){}qr=null}
}
$('#scan-close').onclick=closeScanner;
$('#photo-in').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  $('#scan-msg').textContent='กำลังอ่านจากรูป…';
  try{
    if(qr&&qr.isScanning){await qr.stop()}
    const r=qr||newReader();
    gotCode(await r.scanFile(f,false));
  }catch(err){$('#scan-msg').textContent='อ่านบาร์โค้ดจากรูปไม่ได้ ถ่ายใหม่ให้ใกล้และชัดขึ้น หรือปิดแล้วพิมพ์เลขเอง'}
});
function scanField(id,label){return `<div class="field"><label for="${id}">${label}</label>
  <div class="scanrow"><input class="input mono" id="${id}" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="สแกน หรือพิมพ์เลข">
  <button type="button" class="cam" id="${id}-cam" aria-label="สแกนด้วยกล้อง">${camIcon}</button></div>
  <div class="hint">กดปุ่มกล้องเพื่อสแกน หรือยิงด้วยเครื่องสแกน</div></div>`}
function bindScan(id){document.getElementById(id+'-cam').onclick=()=>openScanner(document.getElementById(id))}

/* ---------- ward combobox ---------- */
function wardCombo(id,val,l){return `<div class="field"><label for="${id}">${l||'วอร์ด'}</label><div class="combo">
  <input class="input" id="${id}" role="combobox" aria-expanded="false" aria-controls="${id}-list" autocomplete="off" placeholder="พิมพ์ค้นหา เช่น อายุร, ICU" value="${esc(val||'')}">
  <ul class="combo-list" id="${id}-list" role="listbox" hidden></ul></div></div>`}
function bindCombo(id){
  const inp=document.getElementById(id),list=document.getElementById(id+'-list');let act=-1,items=[];
  const draw=()=>{const q=inp.value.trim().toLowerCase();items=WARDS.filter(w=>w.toLowerCase().includes(q));
    list.innerHTML=items.length?items.map((w,i)=>`<li role="option" data-w="${esc(w)}" aria-selected="${i===act}">${esc(w)}</li>`).join(''):'<li class="muted">ไม่พบวอร์ดนี้</li>';
    list.hidden=false;inp.setAttribute('aria-expanded','true')};
  const close=()=>{list.hidden=true;inp.setAttribute('aria-expanded','false');act=-1};
  const pick=w=>{inp.value=w;close();inp.dispatchEvent(new Event('change'))};
  inp.addEventListener('focus',()=>{inp.select();draw()});
  inp.addEventListener('input',()=>{act=-1;draw()});
  inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){act=Math.min(act+1,items.length-1);draw();e.preventDefault()}
    else if(e.key==='ArrowUp'){act=Math.max(act-1,0);draw();e.preventDefault()}
    else if(e.key==='Enter'&&act>=0){pick(items[act]);e.preventDefault()}else if(e.key==='Escape')close()});
  list.addEventListener('mousedown',e=>{const li=e.target.closest('li[data-w]');if(li){pick(li.dataset.w);e.preventDefault()}});
  list.addEventListener('touchstart',e=>{const li=e.target.closest('li[data-w]');if(li){pick(li.dataset.w);e.preventDefault()}},{passive:false});
  inp.addEventListener('blur',()=>setTimeout(close,150));
}

/* ---------- date + time of specimen ---------- */
const p2=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
// Sample No. 10 หลัก: หลัก 1–2 = วันที่, 3–4 = เดือน (ไม่มีปี ใช้ปีปัจจุบัน ถ้าเกินวันนี้ถือเป็นปีก่อน)
function dateFromSample(s){
  if(!/^\d{10}$/.test(s))return '';
  const dd=+s.slice(0,2),mm=+s.slice(2,4);if(mm<1||mm>12||dd<1)return '';
  const now=new Date();let d=new Date(now.getFullYear(),mm-1,dd);
  if(d.getMonth()!==mm-1)return '';
  if(d.getTime()-now.getTime()>86400000)d=new Date(now.getFullYear()-1,mm-1,dd);
  return isoDate(d);
}
const thDate=iso=>{const [y,m,d]=iso.split('-');return `${+d}/${+m}/${+y+543}`};
const dayShift=n=>{const d=new Date();d.setDate(d.getDate()+n);return isoDate(d)};
function dtField(id,label){return `<div class="field"><span class="lab">${label}</span>
  <div class="daychips" role="group" aria-label="วันที่ส่งตรวจ">
    <button type="button" class="daychip" data-day="0">วันนี้</button>
    <button type="button" class="daychip" data-day="-1">เมื่อวาน</button>
    <button type="button" class="daychip" data-day="other">วันอื่น</button>
  </div>
  <input class="input" id="${id}-date" type="date" max="${isoDate(new Date())}" aria-label="เลือกวันที่ส่งตรวจ" hidden>
  <div class="small muted" id="${id}-dlabel"></div>
  <label class="lab" for="${id}-time" style="margin-top:4px">เวลาส่งตรวจ</label>
  <input class="input mono timein" id="${id}-time" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="พิมพ์ 4 ตัว เช่น 0830">
  <div class="hint" id="${id}-hint">พิมพ์เวลาเป็นตัวเลข 4 ตัว เช่น 0830 = 08:30 น. · 2015 = 20:15 น.</div></div>`}
function getSpec(id){const dEl=document.getElementById(id+'-date'),tEl=document.getElementById(id+'-time');if(!dEl||!tEl)return '';const d=dEl.value,t=tEl.value;
  return d&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t)?`${d}T${t}`:''}
function bindDT(id){
  const dIn=document.getElementById(id+'-date'),tIn=document.getElementById(id+'-time'),hint=document.getElementById(id+'-hint'),
    lab=document.getElementById(id+'-dlabel'),chips=[...dIn.parentElement.querySelectorAll('.daychip')];
  const sync=()=>{const v=dIn.value,t=dayShift(0),y=dayShift(-1);
    chips.forEach(c=>c.setAttribute('aria-pressed',c.dataset.day==='0'?v===t:c.dataset.day==='-1'?v===y:(!!v&&v!==t&&v!==y)||!dIn.hidden));
    lab.textContent=v?'วันที่ส่งตรวจ: '+thDate(v):'';};
  chips.forEach(c=>c.onclick=()=>{if(c.dataset.day==='other'){dIn.hidden=false;dIn.dataset.auto='';try{dIn.showPicker&&dIn.showPicker()}catch(e){};dIn.focus()}
    else{dIn.hidden=true;dIn.value=dayShift(+c.dataset.day);dIn.dataset.auto='';dIn.dispatchEvent(new Event('change'))}sync()});
  dIn.addEventListener('change',sync);dIn.addEventListener('input',sync);
  if(!dIn.value)dIn.value=dayShift(0);
  sync();
  // เวลา: พิมพ์ตัวเลข 4 ตัว ใส่ : ให้เอง
  const fmtT=()=>{let d=tIn.value.replace(/\D/g,'').slice(0,4);
    tIn.value=d.length===4?d.slice(0,2)+':'+d.slice(2):d;
    const ok=/^([01]\d|2[0-3]):[0-5]\d$/.test(tIn.value);
    tIn.classList.toggle('bad',d.length===4&&!ok);
    hint.textContent=d.length===4&&!ok?'เวลาไม่ถูกต้อง ชั่วโมง 00–23 นาที 00–59':ok?'เวลาส่งตรวจ '+tIn.value+' น.':'พิมพ์เวลาเป็นตัวเลข 4 ตัว เช่น 0830 = 08:30 น. · 2015 = 20:15 น.'};
  tIn.addEventListener('input',fmtT);
  tIn.addEventListener('blur',()=>{const d=tIn.value.replace(/\D/g,'');if(d.length===3){tIn.value='0'+d;fmtT();tIn.dispatchEvent(new Event('change'))}});
  if(tIn.value)fmtT();
}
function bindSampleDate(sampleId,id){
  const s=document.getElementById(sampleId),dIn=document.getElementById(id+'-date');
  dIn.addEventListener('input',()=>{dIn.dataset.auto='0'});
  s.addEventListener('input',()=>{const iso=dateFromSample(s.value.trim());
    if(iso&&(dIn.dataset.auto!=='0')){if(iso!==dayShift(0)&&iso!==dayShift(-1))dIn.hidden=false;dIn.value=iso;dIn.dataset.auto='1';dIn.dispatchEvent(new Event('change'))}});
}
/* กติกาช่วงเวลาตาม Slide — ต้องตรงกับ RULE ใน Code.gs */
const RULE={lateCut:'20:00',normalEnd:'22:00',nextFrom:'08:00',nextTo:'14:00',extEnd:'08:00',extWard:/(^|[^A-Za-z])ER([^A-Za-z]|$)|ฉุกเฉิน|นอกเวลา/i};
function at(day,hhmm){const [y,m,d]=day.split('-').map(Number),[H,M]=hhmm.split(':').map(Number);return new Date(y,m-1,d,H,M)}
function followWindow(specIso,ward){
  const [day,time]=specIso.split('T');const spec=at(day,time);
  const n=new Date(spec.getFullYear(),spec.getMonth(),spec.getDate()+1);const next=isoDate(n);
  const late=time>RULE.lateCut, ext=RULE.extWard.test(ward||'');
  if(ext)return{from:spec,to:late?at(next,RULE.nextTo):at(next,RULE.extEnd),ext};

}
const fmtDT=d=>`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
function ruleHint(specIso,ward){
  if(!specIso)return '';
  const w=followWindow(specIso,ward),now=Date.now();
  if(now>w.to)return `<div class="rule bad">เกินกำหนดการตาม Slide แล้ว (ตามได้ถึง ${fmtDT(w.to)})</div>`;
  if(now<w.from)return `<div class="rule warn">ยังไม่ถึงเวลาตาม Slide ตามได้ ${fmtDT(w.from)} – ${fmtDT(w.to)}</div>`;
  return `<div class="rule">ตามได้ถึง ${fmtDT(w.to)}${w.ext?' (เกณฑ์ ER / OPD นอกเวลา)':''}</div>`;
}

function openModal(html,cls){
  const m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
  m.innerHTML=`<div class="modal-box">${html}<button class="modal-x" aria-label="ปิด">✕</button></div>`;
  const close=()=>{m.remove();document.removeEventListener('keydown',esc_)};
  const esc_=e=>{if(e.key==='Escape')close()};
  m.querySelector('.modal-x').onclick=close;document.addEventListener('keydown',esc_);

  document.body.appendChild(m);m.querySelector('.modal-x').focus();
}

function chipsHtml(list){return `<div class="chips">${list.map(i=>`<button class="chip" data-q="${i}">${esc(FAQ[i].q)}</button>`).join('')}</div>`}
function allChips(){let g='',h='';FAQ.forEach((f,i)=>{if(f.g!==g){g=f.g;h+=`<h4>${esc(g)}</h4>`}h+=`<button class="chip" data-q="${i}">${esc(f.q)}</button>`});return `<div class="chips">${h}</div>`}

    <div class="modal-body"><div class="chat" id="chat"></div><div id="chips">${allChips()}</div></div>`);

  const ask=i=>{const f=FAQ[i];
    chat.insertAdjacentHTML('beforeend',`<div class="msg me"><div class="txt">${esc(f.q)}</div></div>
      <div class="msg"><div class="av">${BOT}</div><div class="txt">${esc(f.a).replace(/&lt;span class=&quot;call&quot;&gt;8133&lt;\/span&gt;/g,CALL)}${f.go?'<div class="go"><button class="btn btn-blue" data-go="search">เปิดหน้าค้นหาสถานะสไลด์</button></div>':''}</div></div>`);

    bindChips();chat.lastElementChild.scrollIntoView({behavior:'smooth',block:'start'})};

const REQUIRE_PHOTO=false; // ต้องตรงกับ Code.gs
// ย่อรูปให้ด้านยาวไม่เกิน 1280px แล้วแปลงเป็น JPEG (ประมาณ 150–300 KB)
function shrinkPhoto(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('อ่านรูปไม่ได้ ถ่ายใหม่อีกครั้ง'))};
  img.src=url;})}
function photoField(id,n){return `<div class="field"><span class="lab">${n||''}ถ่ายภาพหลักฐานการส่งใบตาม${REQUIRE_PHOTO?'':' <span class="opt">(ถ้ามี)</span>'}</span>
  <div class="photo-box" id="${id}-box"><label class="photo-take" for="${id}">${icCam}<span>แตะเพื่อถ่ายภาพใบตามที่วางในตะกร้า</span></label></div>
  <input type="file" id="${id}" accept="image/*" capture="environment" style="position:absolute;opacity:0;width:1px;height:1px"></div>`}
function bindPhoto(id,onChange){
  const inp=document.getElementById(id),box=document.getElementById(id+'-box');
  inp.addEventListener('change',async()=>{const f=inp.files[0];inp.value='';if(!f)return;
    box.innerHTML='<div class="muted small">กำลังเตรียมรูป…</div>';
    try{const data=await shrinkPhoto(f);onChange(data);
      box.innerHTML=`<div class="photo-prev"><img src="${data}" alt="ภาพหลักฐานการส่งใบตาม"><div><div class="flag ok">ถ่ายภาพแล้ว</div><label class="linkbtn" for="${id}" style="display:inline-block;margin-top:6px">ถ่ายใหม่</label></div></div>`}
    catch(e){onChange('');box.innerHTML=`<div class="alert bad">${esc(e.message)}</div><label class="photo-take" for="${id}">${icCam}<span>ถ่ายใหม่</span></label>`}});
}

  $('#f').onsubmit=e=>{e.preventDefault();submit(false,e.target.querySelector('button[type=submit]'))};
}

      <button class="btn btn-blue btn-block" type="submit">ค้นหาใบตาม</button>
    </form>
    <div id="v-card" class="form"></div></section></div>`;
  bindScan('v-sample');bindDT('v');bindSampleDate('v-sample','v');
  if(carryOut){const c=carryOut;carryOut=null;$('#v-sample').value=c.sample;$('#v-hn').value=c.hn;
    const m=/^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}:\d{2})$/.exec(c.specAt||'');
    if(m){const iso=`${m[3]}-${m[2]}-${m[1]}`;const di=$('#v-date');if(iso!==dayShift(0)&&iso!==dayShift(-1))di.hidden=false;di.value=iso;di.dataset.auto='0';di.dispatchEvent(new Event('change'));$('#v-time').value=m[4];$('#v-time').dispatchEvent(new Event('input'))}}
  $('#back').onclick=()=>{view='home';render()};
  $('#v-sample').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#v-hn').focus()}});
  const data=()=>({sample:$('#v-sample').value.trim(),hn:$('#v-hn').value.trim(),specAt:getSpec('v')});
  const card=(r,i,d)=>`<div class="check ${r.sampleOk&&r.specOk?'ok':''}">
      <div class="me"><span class="small muted">ใบตามที่พบ</span>${pill(r.status)}</div>
      <div class="ward-big">${esc(r.ward)}</div>
      <dl class="kv"><dt>HN</dt><dd class="mono" style="font-size:1.1rem;font-weight:600">${esc(r.hn)}</dd>
      <dt>Sample No.</dt><dd class="mono">${r.sample?esc(r.sample):`<span class="muted">ยังไม่ระบุ</span>`}</dd>
      <dt>วันเวลาส่งตรวจ</dt><dd>${esc(r.specAt||'–')}</dd>
      <dt>ส่งใบตามโดย</dt><dd>${esc(r.reqName)}</dd><dt>เวลาส่งใบตาม</dt><dd>${esc(r.reqAt)}</dd></dl>
      <div class="flags">
        ${r.sampleFill?`<div class="flag ok">ระบบจะบันทึก Sample No. ${esc(d.sample)} ลงใบตามนี้ให้</div>`:r.sampleOk?'<div class="flag ok">Sample No. ตรงกับใบตาม</div>':`<div class="flag bad">Sample No. ไม่ตรงกับใบตาม ห้ามหยิบ</div>`}
        ${r.specOk?'<div class="flag ok">วันเวลาส่งตรวจตรงกับใบตาม</div>':'<div class="flag warn">วันเวลาส่งตรวจไม่ตรงกับใบตาม ตรวจให้แน่ใจก่อนหยิบ</div>'}
      </div>
      <div id="err-${i}"></div>
      ${r.sampleOk?`<button class="btn btn-blue btn-block" data-i="${i}">ยืนยันรับสไลด์ HN ${esc(r.hn)}</button>`:''}
    </div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]'),box=$('#v-card');
    const d=data();$('#err').innerHTML='';box.innerHTML='';
    if(!d.sample||!d.hn||!d.specAt){$('#err').innerHTML=errBox('กรอก Sample No., HN และวันเวลาส่งตรวจให้ครบทุกช่อง');return}
    busy(b,true,'กำลังค้นหา…');
    let res;try{res=await run('apiFindForReceive',store.get(TOKEN_KEY),d)}catch(err){$('#err').innerHTML=errBox(err.message);busy(b,false);return}
    busy(b,false);
    if(res.received){const r=res.received;box.innerHTML=`<div class="alert bad">สไลด์ของการส่งตรวจนี้ถูกรับไปแล้ว\nHN ${esc(r.hn)} · Sample No. ${esc(r.sample)} · ส่งตรวจ ${esc(r.specAt||'–')}\nรับโดย ${esc(r.recvName)} เมื่อ ${esc(r.recvAt)}</div>`;return}
    if(!res.open.length){box.innerHTML=`<div class="alert warn">ไม่พบใบตามที่ยังไม่รับของ HN นี้ ถ้าเป็นสไลด์ที่แพทย์ขอ include ให้ใช้ "บันทึกรับ Slide include"</div>
      <button class="btn btn-violet btn-block" id="to-inc">ไปบันทึกรับ Slide include</button>
      <button class="btn btn-ghost btn-block" id="to-search">ค้นหาว่ามีคนรับไปแล้วหรือยัง</button>`;
      $('#to-search').onclick=()=>{searchQ=d.hn;view='search';render()};
      $('#to-inc').onclick=()=>{carry=d;view='include';render()};return}
    box.innerHTML=(res.open.length>1?'<div class="alert info">HN นี้มีใบตามมากกว่า 1 รายการ เลือกรายการที่ตรงกับสไลด์</div>':'')+res.open.map((r,i)=>card(r,i,d)).join('');
    box.scrollIntoView({behavior:'smooth',block:'start'});
    box.querySelectorAll('button[data-i]').forEach(btn=>btn.onclick=async()=>{const r=res.open[+btn.dataset.i];busy(btn,true);
      try{const out=await run('apiCheckOut',store.get(TOKEN_KEY),{row:r.row,sample:d.sample,hn:d.hn,specAt:d.specAt});lastDone={kind:'out',r:out};view='done';render()}
      catch(err){$('#err-'+btn.dataset.i).innerHTML=errBox(err.message);busy(btn,false)}});
  };
}

/* รับ Slide include: ไม่ต้องส่งใบตามก่อน */
let carry=null,carryOut=null;
function vInc(){
  app.innerHTML=`<div class="col"><section class="panel">${backHead('บันทึกรับ Slide include')}
    <div class="alert info">สำหรับสไลด์ที่แพทย์ขอ include ห้องปฏิบัติการวางไว้ในตะกร้าแล้ว หยิบได้เลยโดยไม่ต้องส่งใบตาม</div>
    <button class="linkbtn" id="inc-search">หาในตะกร้าไม่เจอ? ค้นหาว่ามีคนรับไปแล้วหรือยัง</button>
    <form id="f" class="form" novalidate>
      ${scanField('i-sample','Sample No.')}
      ${hnField('i-hn')}
      ${wardCombo('i-ward',store.get(WARD_KEY)||'')}
      <div id="inc-warn"></div>
      ${meBox('ผู้รับสไลด์')}
      <div class="hint">เวลารับสไลด์จะบันทึกให้อัตโนมัติเมื่อกดยืนยัน</div>
      <div id="err"></div>
      <button class="btn btn-violet btn-block" type="submit">ยืนยันรับ Slide include</button>
    </form></section></div>`;
  bindScan('i-sample');bindCombo('i-ward');
  $('#back').onclick=()=>{view='home';render()};
  $('#inc-search').onclick=()=>{view='search';render()};
  if(carry){$('#i-sample').value=carry.sample;$('#i-hn').value=carry.hn;carry=null}
  $('#i-sample').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#i-hn').focus()}});
  // ถ้าสไลด์นี้ส่งใบตามไว้แล้วและยังรอรับ ต้องไปบันทึกที่ปุ่มสีฟ้า "บันทึกรับสไลด์"
  const showPending=recs=>{const w=$('#inc-warn');if(!recs.length){w.innerHTML='';return false}
    const r=recs[0];
    w.innerHTML=`<div class="pending" role="alert"><h3>สไลด์นี้มีการส่งใบตามไว้แล้วครับ</h3>
      <div class="small">กรุณาบันทึกที่ปุ่มสีฟ้า <b>"บันทึกรับสไลด์"</b> แทนนะครับ ไม่ต้องบันทึกในช่อง Slide include</div>
      <dl class="kv"><dt>HN</dt><dd class="mono">${esc(r.hn)}</dd><dt>Sample No.</dt><dd class="mono">${sampleTxt(r.sample)}</dd>
      <dt>วอร์ด</dt><dd>${esc(r.ward)}</dd><dt>วันเวลาส่งตรวจ</dt><dd>${esc(r.specAt||'–')}</dd>
      <dt>ส่งใบตามโดย</dt><dd>${esc(r.reqName)} · ${esc(r.reqAt)}</dd></dl>
      <button type="button" class="btn btn-blue btn-block" id="to-out">ไปที่บันทึกรับสไลด์ (สีฟ้า)</button>
      <div class="small">หากแน่ใจว่าเป็นสไลด์ของการส่งตรวจคนละครั้ง กรุณาสอบถามห้องปฏิบัติการที่ <span class="call">8133</span> ครับ</div></div>`;
    $('#to-out').onclick=()=>{carryOut={sample:$('#i-sample').value.trim(),hn:r.hn,specAt:r.specAt};view='checkout';render()};
    w.scrollIntoView({behavior:'smooth',block:'center'});
    if(navigator.vibrate)navigator.vibrate([120,80,120]);return true};
  let seq=0,timer=null;
  const check=async()=>{const sample=$('#i-sample').value.trim(),hn=$('#i-hn').value.trim();
    if(!sample||!hn){$('#inc-warn').innerHTML='';return}
    const my=++seq;let r;try{r=await run('apiIncludeCheck',store.get(TOKEN_KEY),{sample,hn})}catch(e){return}
    if(my===seq)showPending(r.pending)};
  ['i-sample','i-hn'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(check,600)}));
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');$('#err').innerHTML='';
    const d={sample:$('#i-sample').value.trim(),hn:$('#i-hn').value.trim(),ward:$('#i-ward').value.trim()};
    if(!d.sample||!d.hn){$('#err').innerHTML=errBox('กรุณากรอก Sample No. และ HN ให้ครบครับ');return}
    busy(b,true);
    try{const r=await run('apiInclude',store.get(TOKEN_KEY),d);
      if(r.pending){busy(b,false);showPending(r.pending);return}
      store.set(WARD_KEY,r.ward);lastDone={kind:'inc',r};view='done';render()}
    catch(err){$('#err').innerHTML=errBox(err.message);busy(b,false)}};
}
/* ค้นหาสถานะสไลด์ ด้วย HN หรือ Sample No. */
let searchQ='';
function vSearch(){
  app.innerHTML=`<div class="col"><section class="panel">${backHead('ค้นหาสถานะสไลด์')}
    <div class="small muted">ตรวจว่าสไลด์ถูกบันทึกรับไปแล้วหรือยัง ใครรับไป และเมื่อไร (ย้อนหลัง 7 วัน)</div>
    <form id="f" class="form" novalidate>
      ${scanField('s-q','HN หรือ Sample No.')}
      <div id="err"></div>
      <button class="btn btn-blue btn-block" type="submit">ค้นหา</button>
    </form>
    <div id="s-res" class="form"></div></section></div>`;
  bindScan('s-q');
  $('#back').onclick=()=>{view='home';render()};
  const inp=$('#s-q');
  const card=r=>`<div class="res ${r.status}">
    <div class="me"><span class="big-st">${r.status==='out'?'รับสไลด์ไปแล้ว':'ยังไม่มีผู้บันทึกรับ'}</span>${r.include?'<span class="tag-inc">Include</span>':''}</div>
    <dl class="kv"><dt>HN</dt><dd class="mono" style="font-weight:600">${esc(r.hn)}</dd><dt>Sample No.</dt><dd class="mono">${sampleTxt(r.sample)}</dd>
    <dt>วอร์ด</dt><dd>${esc(r.ward)}</dd>${r.specAt?`<dt>วันเวลาส่งตรวจ</dt><dd>${esc(r.specAt)}</dd>`:''}
    ${r.include?'':`<dt>ส่งใบตามโดย</dt><dd>${esc(r.reqName)}<br><span class="small muted">${esc(r.reqAt)}</span></dd>`}
    ${r.status==='out'?`<dt>รับไปโดย</dt><dd><b>${esc(r.recvName)}</b><br><span class="small muted">${esc(r.recvAt)}</span></dd>`:''}</dl>
    ${r.status==='in'?'<div class="small muted">ยังไม่มีใครบันทึกรับ สไลด์ควรอยู่ในตะกร้า หรือยังรอห้องปฏิบัติการ</div>':''}
  </div>`;
  const go=async b=>{const q=inp.value.trim();$('#err').innerHTML='';const box=$('#s-res');
    if(!q){$('#err').innerHTML=errBox('กรอก HN หรือ Sample No. ที่ต้องการค้นหา');return}
    searchQ=q;busy(b,true,'กำลังค้นหา…');
    try{const rows=await run('apiSearch',store.get(TOKEN_KEY),q);
      box.innerHTML=rows.length?`<div class="small muted">พบ ${rows.length} รายการ</div>`+rows.map(card).join(''):
        `<div class="alert warn">ไม่พบข้อมูลของ ${esc(q)} ใน 7 วันล่าสุด\n• ถ้าเป็น Slide include แปลว่ายังไม่มีใครบันทึกรับ ลองหาในตะกร้าอีกครั้ง\n• หากยังไม่พบ สอบถามได้ที่ 8133</div>`;
      box.scrollIntoView({behavior:'smooth',block:'start'})}
    catch(err){$('#err').innerHTML=errBox(err.message)}
    busy(b,false)};
  $('#f').onsubmit=e=>{e.preventDefault();go(e.target.querySelector('button[type=submit]'))};
  if(searchQ){inp.value=searchQ}
}
function vDone(){
  const {kind,r}=lastDone;
  const T={in:['บันทึกส่งใบตามสไลด์แล้ว','ส่งใบตามอีกรายการ','checkin','btn-teal'],out:['บันทึกรับสไลด์แล้ว','รับสไลด์อีกรายการ','checkout','btn-blue'],inc:['บันทึกรับ Slide include แล้ว','รับ Slide include อีกรายการ','include','btn-violet']}[kind];
  app.innerHTML=`<div class="col"><section class="panel done">
    <div class="tick"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></div>
    <h2>${T[0]}</h2>
    <div class="time">${esc(r.time)}</div><div class="small muted">${esc(r.date)}</div>
    <dl class="kv" style="text-align:left"><dt>HN</dt><dd class="mono">${esc(r.hn)}</dd><dt>Sample No.</dt><dd class="mono">${sampleTxt(r.sample)}</dd>
    ${r.specAt?`<dt>วันเวลาส่งตรวจ</dt><dd>${esc(r.specAt)}</dd>`:''}<dt>วอร์ด</dt><dd>${esc(r.ward)}</dd></dl>
    ${kind==='in'?`<p class="small muted" style="margin:0">กลับมารับสไลด์ได้ประมาณ ${LATE_MIN} นาที ตอนรับต้องกรอก Sample No., HN และวันเวลาส่งตรวจ</p>`:''}
    <button class="btn btn-ghost btn-block" id="again">${T[1]}</button>
    <button class="btn ${T[3]} btn-block" id="home">กลับหน้าแรก</button></section></div>`;
  $('#again').onclick=()=>{view=T[2];render()};
  $('#home').onclick=()=>{view='home';render()};
}

/* ---------- lab overview ---------- */
function vPin(){
  app.innerHTML=`<div class="col"><section class="panel"><h2>ภาพรวมห้องปฏิบัติการ</h2>
    <form id="f" class="form" novalidate><div class="field"><label for="pin">PIN ของห้องปฏิบัติการ</label>
    <input class="input mono" id="pin" type="password" inputmode="numeric" autocomplete="off"></div>
    <div id="err"></div><button class="btn btn-blue btn-block" type="submit">เข้าดูภาพรวม</button></form></section></div>`;
  $('#pin').focus();
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');busy(b,true,'กำลังตรวจสอบ…');
    try{labRows=await run('apiLabList',$('#pin').value);labPin=$('#pin').value;try{sessionStorage.setItem('cbcLabPin',labPin)}catch(x){}renderLab()}
    catch(err){$('#err').innerHTML=`<div class="alert bad">${esc(err.message)}</div>`;busy(b,false)}};
}
async function reloadLab(){try{labRows=await run('apiLabList',labPin);if(mode==='lab')renderLab()}catch(err){toast(err.message)}}
function renderLab(){
  const c=k=>labRows.filter(r=>r.status===k).length;
  let rows=labRows.filter(r=>r.status===labFilter);
  const q=labQ.trim().toLowerCase();
  if(q)rows=rows.filter(r=>[r.sample,r.hn,r.ward,r.reqName].join(' ').toLowerCase().includes(q));
  rows.sort((a,b)=>labFilter==='in'?a.reqTs-b.reqTs:b.recvTs-a.recvTs);
  const stat=(k,n,l)=>`<button class="stat" data-f="${k}" aria-pressed="${labFilter===k}"><div class="n">${n}</div><div class="l">${l}</div></button>`;
  app.innerHTML=`<div class="wide">
   <div class="stats">${stat('in',c('in'),'ส่งใบตามแล้ว ยังไม่รับ')}${stat('out',c('out'),'รับสไลด์แล้ว (3 วันล่าสุด)')}</div>
   <div class="toolbar"><input class="input" id="lab-q" placeholder="ค้นหา Sample No., HN, วอร์ด, ชื่อ" value="${esc(labQ)}">
     <button class="btn btn-ghost" id="lab-refresh">รีเฟรช</button>
     <span class="small muted">${labFilter==='in'?`แดง = ส่งใบตามเกิน ${LATE_MIN} นาทีแล้วยังไม่มารับ · `:''}รีเฟรชเองทุก 1 นาที</span></div>
   <div class="tbl-wrap"><table><thead><tr><th>HN</th><th>Sample No.</th><th>วอร์ด</th><th>วันเวลาส่งตรวจ</th><th>ส่งใบตาม: ผู้ส่ง / เวลา</th><th>รับสไลด์: ผู้รับ / เวลา</th><th>${labFilter==='in'?'รอมาแล้ว':'ใช้เวลา'}</th></tr></thead><tbody>
   ${rows.length?rows.map(r=>{const m=r.reqTs?Math.round(((r.recvTs||Date.now())-r.reqTs)/60000):null;
     const late=r.status==='in'&&m>LATE_MIN;
     return `<tr><td class="mono">${esc(r.hn)}</td><td class="mono">${r.sample?esc(r.sample):'<span class="muted">–</span>'}</td><td>${esc(r.ward)}</td>
       <td>${esc(r.specAt||'–')}</td>
       <td>${r.include?'<span class="tag-inc" style="margin:0">Include</span><br><span class="small muted">ไม่ได้ส่งใบตาม</span>':`${esc(r.reqName)}<br><span class="small muted">${esc(r.reqAt)}</span>${r.photo?`<br><a class="small" href="${esc(r.photo)}" target="_blank" rel="noopener">ดูรูปหลักฐาน</a>`:''}`}</td>
       <td>${r.status==='out'?`${esc(r.recvName)}<br><span class="small muted">${esc(r.recvAt)}</span>`:'<span class="muted">–</span>'}</td>
       <td class="${late?'late':''}">${m==null?'–':dur(m)}</td></tr>`}).join(''):'<tr><td colspan="7" class="muted" style="text-align:center;padding:28px">ไม่มีรายการในกลุ่มนี้</td></tr>'}
   </tbody></table></div></div>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{labFilter=b.dataset.f;renderLab()});
  $('#lab-refresh').onclick=reloadLab;
  const qi=$('#lab-q');qi.oninput=()=>{labQ=qi.value;const p=qi.selectionStart;renderLab();const n=$('#lab-q');n.focus();n.setSelectionRange(p,p)};
}

/* ---------- start ---------- */
const FS_KEY='cbcFontSize';
function setFS(v){document.documentElement.style.setProperty('--fs',v);store.set(FS_KEY,v);
  document.querySelectorAll('.fs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.fs===String(v)))}
document.querySelectorAll('.fs button').forEach(b=>b.onclick=()=>setFS(b.dataset.fs));
setFS(store.get(FS_KEY)||'1.12');
$('#mode-ward').onclick=()=>{mode='ward';if(view==='done')view='home';render()};
$('#mode-lab').onclick=async()=>{mode='lab';if(!labPin){try{labPin=sessionStorage.getItem('cbcLabPin')||''}catch(e){}}
  if(labPin){app.innerHTML='<div class="loading">กำลังโหลด…</div>';try{labRows=await run('apiLabList',labPin)}catch(e){labPin=''}}render()};
setInterval(()=>{if(mode==='lab'&&labPin&&document.activeElement&&document.activeElement.id!=='lab-q')reloadLab()},60000);

run('apiInit',store.get(TOKEN_KEY)).then(d=>{WARDS=d.wards;ME=d.me;LATE_MIN=d.lateMin;view=ME?'home':'register';render()})
  .catch(err=>{app.innerHTML=`<div class="col"><div class="alert bad">โหลดไม่สำเร็จ: ${esc(err.message)}</div></div>`});
})();
</script>
