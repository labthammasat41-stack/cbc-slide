<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดตามสไลด์ CBC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#1d2033; --muted:#5f6480; --line:#dcdfeb;
  --eosin:#b8326a; --eosin-soft:#fbe8f0; --blue:#2f4fa8; --blue-soft:#e6ecfa;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --warn:#a35b00; --warn-soft:#fdf0dc; --bad:#b42318; --bad-soft:#fde8e6;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13141d; --surface:#1c1e2b; --ink:#eceef7; --muted:#a0a5c0; --line:#30344a;
  --eosin:#ec7aa8; --eosin-soft:#3a1d2b; --blue:#8fa8f0; --blue-soft:#1f2747;
  --ok:#5fcf93; --ok-soft:#173326; --warn:#f0b155; --warn-soft:#3a2a12; --bad:#f2837a; --bad-soft:#3d1c1a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25}
h1{font-size:1.35rem} h2{font-size:1.2rem} h3{font-size:1rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.muted{color:var(--muted)} .small{font-size:.85rem}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.topbar{max-width:980px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.col{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wide{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.95rem}
.hint{font-size:.8rem;color:var(--muted)}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:1rem;min-width:0}
.input:focus{border-color:var(--blue);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scanrow{display:flex;gap:8px}.scanrow .input{flex:1}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--eosin);color:#fff}.btn-blue{background:var(--blue);color:#fff}.btn-ok{background:var(--ok);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:wait}
.btn-block{width:100%;padding:15px;font-size:1.05rem}
.cam{flex:none;width:56px;background:var(--blue);color:#fff;border-radius:10px;border:0;cursor:pointer;display:grid;place-items:center}
.cam svg{width:26px;height:26px}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border:0;border-radius:16px;padding:22px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;min-height:130px;color:#fff}
.big b{font-family:var(--f-display);font-size:1.3rem}.big span{font-size:.85rem;opacity:.9}
.big.req{background:var(--eosin)}.big.recv{background:var(--blue)}
.me{display:flex;justify-content:space-between;gap:10px;align-items:center}
.me-info{display:flex;gap:12px;align-items:center;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--eosin-soft);color:var(--eosin);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;padding:4px;font-size:.88rem;text-decoration:underline;align-self:flex-start}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:4px;margin:0;list-style:none}
.combo-list li{padding:10px 12px;border-radius:8px;cursor:pointer}
.combo-list li[aria-selected="true"],.combo-list li:hover{background:var(--blue-soft)}
.check{border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.check.ok{border-color:var(--ok)}
.ward-big{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-in{background:var(--warn-soft);color:var(--warn)}.st-out{background:var(--ok-soft);color:var(--ok)}
.dupcard{border:2px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dupcard h3{color:var(--warn)}
.dupcard .kv dd{font-weight:600}
.done{text-align:center;align-items:center}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.time{font-family:var(--f-mono);font-size:1.5rem}
.mylist .it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.mylist .it:first-child{border-top:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:520px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.stat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stat .n{font-family:var(--f-display);font-size:1.8rem;font-weight:700;line-height:1}.stat .l{font-size:.82rem;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar .input{max-width:320px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts .btn{padding:7px 10px;font-size:.82rem;border-radius:8px}
.late{color:var(--bad);font-weight:600}
.alert{padding:12px 14px;border-radius:10px;font-size:.92rem}
.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.ok{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:.92rem;z-index:30;max-width:calc(100% - 32px)}
.loading{text-align:center;color:var(--muted);padding:40px 0}
/* scanner overlay */
.scan-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;color:#fff}
#reader{width:min(100%,460px);border-radius:12px;overflow:hidden;background:#000}
.scan-ov .msg{text-align:center;font-size:.92rem;max-width:420px}
.scan-ov .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.scan-ov .btn-ghost{border-color:rgba(255,255,255,.4);color:#fff}
.photo-btn{background:#fff;color:#1d2033}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div><h1>สมุดตามสไลด์ CBC</h1><div class="small muted">Center Lab</div></div>
  <div class="seg" role="group" aria-label="สลับมุมมอง">
    <button id="mode-ward" aria-pressed="true">เจ้าหน้าที่วอร์ด</button>
    <button id="mode-lab" aria-pressed="false">ภาพรวม Center Lab</button>
  </div>
</header>
<main id="app"><div class="loading">กำลังโหลด…</div></main>

<div class="scan-ov" id="scan-ov" hidden>
  <div id="reader"></div>
  <div class="msg" id="scan-msg">เล็งบาร์โค้ดให้อยู่ในกรอบ ถือนิ่งๆ</div>
  <div class="row">
    <label class="btn photo-btn" for="photo-in">ถ่ายรูปบาร์โค้ดแทน</label>
    <button class="btn btn-ghost" id="scan-close">ปิด</button>
  </div>
  <input type="file" id="photo-in" accept="image/*" capture="environment" style="position:absolute;opacity:0;width:1px;height:1px">
</div>

<script>
(function(){
const TOKEN_KEY='cbcSlideToken';
const STATUS={in:'ตามแล้ว รอรับ',out:'รับแล้ว'};
let WARDS=[], ME=null, LATE_MIN=30, mode='ward', view='home', lastDone=null, labPin='', labRows=[], labFilter='open', labQ='';

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
// ลิงก์ /exec ของ Apps Script (ตัวรับข้อมูลที่บันทึกลง Google Sheets)
const API_URL='https://script.google.com/macros/s/AKfycbyqxxgojW1ClbxC3L49933YuOZxhVTChcOFa1aWwIeeKNhaBQT0Ettu6fheGU02S_Ex8g/exec';
async function run(fn,...args){
  let res;
  try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow'})}
  catch(e){throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่')}
  let j;try{j=await res.json()}catch(e){throw new Error('ระบบตอบกลับผิดรูปแบบ ตรวจว่าอัปเดตโค้ด Apps Script และทำให้ใช้งานได้เป็นเวอร์ชันใหม่แล้ว')}
  if(!j.ok)throw new Error(j.error||'เกิดข้อผิดพลาด');
  return j.data;
}
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pill=st=>`<span class="pill st-${st}">${STATUS[st]||st}</span>`;
const dur=m=>m<60?`${m} นาที`:`${Math.floor(m/60)} ชม. ${m%60} นาที`;
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function busy(btn,on,label){if(!btn)return;btn.disabled=on;if(on){btn.dataset.l=btn.textContent;btn.textContent=label||'กำลังบันทึก…'}else if(btn.dataset.l)btn.textContent=btn.dataset.l}
const camIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>';

/* ---------- live camera scanner ---------- */
let qr=null, scanTarget=null;
const FORMATS=()=>window.Html5QrcodeSupportedFormats?[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.CODE_93,Html5QrcodeSupportedFormats.CODABAR,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.QR_CODE]:undefined;
function gotCode(text){
  if(!scanTarget)return;
  scanTarget.value=String(text).trim();
  scanTarget.dispatchEvent(new Event('input',{bubbles:true}));
  if(navigator.vibrate)navigator.vibrate(80);
  closeScanner();
}
async function openScanner(target){
  scanTarget=target;
  $('#scan-ov').hidden=false;$('#scan-msg').textContent='กำลังเปิดกล้อง…';
  if(!window.Html5Qrcode){$('#scan-msg').textContent='โหลดตัวอ่านบาร์โค้ดไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่ หรือพิมพ์เลขเอง';return}
  try{
    qr=new Html5Qrcode('reader',{formatsToSupport:FORMATS(),verbose:false});
    await qr.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.floor(w*0.85),height:Math.floor(Math.min(h,w)*0.45)})},gotCode,()=>{});
    $('#scan-msg').textContent='เล็งบาร์โค้ดให้อยู่ในกรอบ ถือนิ่งๆ ห่างประมาณ 10–15 ซม.';
  }catch(e){
    $('#scan-msg').textContent='เปิดกล้องสดไม่ได้ ('+(e&&e.name||'ไม่ได้รับอนุญาต')+') กด "ถ่ายรูปบาร์โค้ดแทน" หรือปิดแล้วพิมพ์เลขเอง';
  }
}
async function closeScanner(){
  $('#scan-ov').hidden=true;
  if(qr){try{if(qr.isScanning)await qr.stop();qr.clear()}catch(e){}qr=null}
}
$('#scan-close').onclick=closeScanner;
$('#photo-in').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  $('#scan-msg').textContent='กำลังอ่านจากรูป…';
  try{
    if(qr&&qr.isScanning){await qr.stop()}
    const r=qr||new Html5Qrcode('reader',{formatsToSupport:FORMATS(),verbose:false});
    const text=await r.scanFile(f,false);gotCode(text);
  }catch(err){$('#scan-msg').textContent='อ่านบาร์โค้ดจากรูปไม่ได้ ถ่ายใหม่ให้ใกล้และชัดขึ้น หรือปิดแล้วพิมพ์เลขเอง'}
});
function scanField(id,label){return `<div class="field"><label for="${id}">${label}</label>
  <div class="scanrow"><input class="input mono" id="${id}" inputmode="numeric" autocomplete="off" placeholder="สแกน หรือพิมพ์เลข">
  <button type="button" class="cam" id="${id}-cam" aria-label="สแกนด้วยกล้อง">${camIcon}</button></div>
  <div class="hint">กดปุ่มกล้องเพื่อสแกน หรือยิงด้วยเครื่องสแกน</div></div>`}
function bindScan(id){document.getElementById(id+'-cam').onclick=()=>openScanner(document.getElementById(id))}

/* ---------- ward combobox ---------- */
function wardCombo(id,val){return `<div class="field"><label for="${id}">วอร์ด</label><div class="combo">
  <input class="input" id="${id}" role="combobox" aria-expanded="false" aria-controls="${id}-list" autocomplete="off" placeholder="พิมพ์ค้นหา เช่น อายุร, ICU" value="${esc(val||'')}">
  <ul class="combo-list" id="${id}-list" role="listbox" hidden></ul></div></div>`}
function bindCombo(id){
  const inp=document.getElementById(id),list=document.getElementById(id+'-list');let act=-1,items=[];
  const draw=()=>{const q=inp.value.trim().toLowerCase();items=WARDS.filter(w=>w.toLowerCase().includes(q));
    list.innerHTML=items.length?items.map((w,i)=>`<li role="option" data-w="${esc(w)}" aria-selected="${i===act}">${esc(w)}</li>`).join(''):'<li class="muted">ไม่พบวอร์ดนี้</li>';
    list.hidden=false;inp.setAttribute('aria-expanded','true')};
  const close=()=>{list.hidden=true;inp.setAttribute('aria-expanded','false');act=-1};
  inp.addEventListener('focus',()=>{inp.select();draw()});
  inp.addEventListener('input',()=>{act=-1;draw()});
  inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){act=Math.min(act+1,items.length-1);draw();e.preventDefault()}
    else if(e.key==='ArrowUp'){act=Math.max(act-1,0);draw();e.preventDefault()}
    else if(e.key==='Enter'&&act>=0){inp.value=items[act];close();e.preventDefault()}else if(e.key==='Escape')close()});
  list.addEventListener('mousedown',e=>{const li=e.target.closest('li[data-w]');if(li){inp.value=li.dataset.w;close();e.preventDefault()}});
  list.addEventListener('touchstart',e=>{const li=e.target.closest('li[data-w]');if(li){inp.value=li.dataset.w;close();e.preventDefault()}},{passive:false});
  inp.addEventListener('blur',()=>setTimeout(close,150));
}

/* ---------- ward views ---------- */
function render(){
  $('#mode-ward').setAttribute('aria-pressed',mode==='ward');$('#mode-lab').setAttribute('aria-pressed',mode==='lab');
  if(mode==='lab')return labPin?renderLab():vPin();
  if(!ME&&view!=='login')view='register';
  ({register:vRegister,login:vLogin,home:vHome,request:vRequest,receive:vReceive,done:vDone})[view]();
}
function vRegister(){
  app.innerHTML=`<div class="col"><section class="panel">
    <div><h2>ลงทะเบียนครั้งแรก</h2><p class="muted small" style="margin:4px 0 0">กรอกครั้งเดียว เครื่องนี้จะจำชื่อคุณไว้</p></div>
    <form id="f" class="form" novalidate>
      <div class="field"><label for="r-id">รหัสพนักงาน</label><input class="input mono" id="r-id" inputmode="numeric"></div>
      <div class="row2"><div class="field"><label for="r-first">ชื่อ</label><input class="input" id="r-first"></div>
      <div class="field"><label for="r-last">นามสกุล</label><input class="input" id="r-last"></div></div>
      <div class="row2"><div class="field"><label for="r-nick">ชื่อเล่น</label><input class="input" id="r-nick"></div>
      <div class="field"><label for="r-phone">เบอร์มือถือ</label><input class="input mono" id="r-phone" inputmode="tel" maxlength="10" placeholder="08xxxxxxxx"></div></div>
      ${wardCombo('r-ward','')}
      <div id="err"></div>
      <button class="btn btn-primary btn-block" type="submit">ลงทะเบียนและเริ่มใช้งาน</button>
    </form>
    <button class="linkbtn" id="to-login">เคยลงทะเบียนแล้ว แต่เปลี่ยนเครื่อง</button></section></div>`;
  bindCombo('r-ward');
  $('#to-login').onclick=()=>{view='login';render()};
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');
    const v=k=>document.getElementById('r-'+k).value.trim();
    busy(b,true);
    try{const r=await run('apiRegister',{id:v('id'),first:v('first'),last:v('last'),nick:v('nick'),phone:v('phone'),ward:v('ward')});
      store.set(TOKEN_KEY,r.token);ME=r.me;view='home';render();toast('ลงทะเบียนแล้ว ยินดีต้อนรับ '+ME.nick)}
    catch(err){$('#err').innerHTML=`<div class="alert bad">${esc(err.message)}</div>`;busy(b,false)}};
}
function vLogin(){
  app.innerHTML=`<div class="col"><section class="panel"><h2>เข้าใช้บนเครื่องใหม่</h2>
   <form id="f" class="form" novalidate>
   <div class="field"><label for="l-id">รหัสพนักงาน</label><input class="input mono" id="l-id" inputmode="numeric"></div>
   <div class="field"><label for="l-phone">เบอร์มือถือที่ลงทะเบียนไว้</label><input class="input mono" id="l-phone" inputmode="tel" maxlength="10"></div>
   <div id="err"></div><button class="btn btn-primary btn-block" type="submit">เข้าใช้งาน</button></form>
   <button class="linkbtn" id="back">กลับไปลงทะเบียนใหม่</button></section></div>`;
  $('#back').onclick=()=>{view='register';render()};
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');busy(b,true,'กำลังตรวจสอบ…');
    try{const r=await run('apiLogin',$('#l-id').value,$('#l-phone').value);store.set(TOKEN_KEY,r.token);ME=r.me;view='home';render();toast('สวัสดี '+ME.nick)}
    catch(err){$('#err').innerHTML=`<div class="alert bad">${esc(err.message)}</div>`;busy(b,false)}};
}
function vHome(){
  app.innerHTML=`<div class="col">
   <section class="panel"><div class="me"><div class="me-info"><div class="avatar">${esc(String(ME.nick).slice(0,2))}</div>
     <div style="min-width:0"><b>${esc(ME.first)} ${esc(ME.last)} (${esc(ME.nick)})</b><div class="small muted">${esc(ME.ward)} · รหัส <span class="mono">${esc(ME.id)}</span></div></div></div>
     <button class="linkbtn" id="logout">ไม่ใช่ฉัน</button></div></section>
   <div class="big-actions">
     <button class="big req" id="go-req"><b>บันทึกเข้า</b><span>มาตามสไลด์ ส่งใบตาม</span></button>
     <button class="big recv" id="go-recv"><b>บันทึกออก</b><span>มารับสไลด์จากตะกร้า</span></button>
   </div>
   <section class="panel"><div class="me"><h3>สไลด์ของวอร์ด ${esc(ME.ward)}</h3><button class="linkbtn" id="refresh">รีเฟรช</button></div>
    <div class="mylist" id="mylist"><div class="muted small">กำลังโหลด…</div></div></section></div>`;
  $('#logout').onclick=()=>{store.del(TOKEN_KEY);ME=null;view='login';render()};
  $('#go-req').onclick=()=>{view='request';render()};
  $('#go-recv').onclick=()=>{view='receive';render()};
  const load=async()=>{try{const rows=await run('apiMyWard',store.get(TOKEN_KEY));
    $('#mylist').innerHTML=rows.length?rows.map(r=>`<div class="it"><div style="min-width:0"><div class="mono">${esc(r.sample)}</div><div class="small muted">HN ${esc(r.hn)} · ตาม ${esc(r.reqAt)}</div></div>${pill(r.status)}</div>`).join(''):'<div class="muted small">ยังไม่มีรายการ เมื่อกด "ตามสไลด์" รายการจะขึ้นที่นี่</div>'}
    catch(err){$('#mylist').innerHTML=`<div class="alert bad">${esc(err.message)}</div>`}};
  $('#refresh').onclick=load;load();
}
function dupCard(r){
  const mins=Math.round((Date.now()-r.reqTs)/60000);
  return `<div class="dupcard" role="alert"><h3>Sample No. นี้ตามไปแล้ว</h3>
    <div class="small">ยังไม่ได้บันทึกออก ไม่ต้องบันทึกเข้าซ้ำ</div>
    <dl class="kv"><dt>Sample No.</dt><dd class="mono">${esc(r.sample)}</dd><dt>HN</dt><dd class="mono">${esc(r.hn)}</dd>
    <dt>วอร์ด</dt><dd>${esc(r.ward)}</dd><dt>ตามโดย</dt><dd>${esc(r.reqName)}</dd>
    <dt>เวลาตาม</dt><dd>${esc(r.reqAt)} <span class="small">(${dur(mins)}ที่แล้ว)</span></dd></dl></div>`;
}
function vRequest(){
  app.innerHTML=`<div class="col"><section class="panel">
    <div><button class="linkbtn" id="back">← กลับ</button><h2>บันทึกเข้า · ตามสไลด์</h2></div>
    <form id="f" class="form" novalidate>
      ${scanField('q-sample','Sample No.')}
      <div id="dup"></div>
      <div class="field"><label for="q-hn">HN</label><input class="input mono" id="q-hn" inputmode="numeric" autocomplete="off"></div>
      ${wardCombo('q-ward',ME.ward)}
      <div class="field"><label>ผู้ตาม</label><div class="input" style="background:var(--surface)">${esc(ME.first)} ${esc(ME.last)} (${esc(ME.nick)})</div></div>
      <div class="hint">วันที่และเวลาจะบันทึกให้อัตโนมัติเมื่อกดยืนยัน</div>
      <div id="err"></div>
      <button class="btn btn-primary btn-block" type="submit">ยืนยันบันทึกเข้า</button>
    </form></section></div>`;
  bindScan('q-sample');bindCombo('q-ward');
  $('#back').onclick=()=>{view='home';render()};
  const inp=$('#q-sample');let seq=0,timer=null;
  // ตรวจทันทีหลังสแกน ว่าเคยตามไปแล้วหรือยัง
  const check=async()=>{const s=inp.value.trim(),box=$('#dup');if(!s){box.innerHTML='';return}
    const my=++seq;let r=null;try{r=await run('apiLookup',store.get(TOKEN_KEY),s)}catch(e){return}
    if(my!==seq)return;
    box.innerHTML=r&&r.status==='in'?dupCard(r):'';
    if(r&&r.status==='in'&&navigator.vibrate)navigator.vibrate([120,80,120]);};
  inp.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(check,500)});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(timer);check();$('#q-hn').focus()}});
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');busy(b,true);$('#err').innerHTML='';
    try{const r=await run('apiCheckIn',store.get(TOKEN_KEY),inp.value,$('#q-hn').value,$('#q-ward').value);
      if(r.dup){$('#dup').innerHTML=dupCard(r.rec);$('#dup').scrollIntoView({behavior:'smooth',block:'center'});busy(b,false);return}
      lastDone={kind:'req',r};view='done';render()}
    catch(err){$('#err').innerHTML=`<div class="alert bad">${esc(err.message)}</div>`;busy(b,false)}};
}
function vReceive(){
  app.innerHTML=`<div class="col"><section class="panel">
    <div><button class="linkbtn" id="back">← กลับ</button><h2>บันทึกออก · รับสไลด์</h2></div>
    ${scanField('v-sample','Sample No. บนสไลด์หรือใบตาม')}
    <div id="v-card"></div></section></div>`;
  bindScan('v-sample');
  $('#back').onclick=()=>{view='home';render()};
  const inp=$('#v-sample');let seq=0,timer=null;
  const show=async()=>{const s=inp.value.trim(),box=$('#v-card');if(!s){box.innerHTML='';return}
    const my=++seq;box.innerHTML='<div class="muted small">กำลังค้นหา…</div>';
    let r;try{r=await run('apiLookup',store.get(TOKEN_KEY),s)}catch(err){box.innerHTML=`<div class="alert bad">${esc(err.message)}</div>`;return}
    if(my!==seq)return;
    if(!r){box.innerHTML='<div class="alert warn">ไม่พบการบันทึกเข้าของ Sample No. นี้ ตรวจเลขอีกครั้ง หรือแจ้งเจ้าหน้าที่ Center Lab</div>';return}
    const wrong=r.ward!==r.myWard;
    box.innerHTML=`<div class="check ${r.status==='in'?'ok':''}">
      <div class="me"><span class="small muted">ตรวจให้ตรงก่อนหยิบ</span>${pill(r.status)}</div>
      <div class="ward-big">${esc(r.ward)}</div>
      <dl class="kv"><dt>HN</dt><dd class="mono">${esc(r.hn)}</dd><dt>Sample No.</dt><dd class="mono">${esc(r.sample)}</dd>
      <dt>ตามโดย</dt><dd>${esc(r.reqName)}</dd><dt>เวลาตาม</dt><dd>${esc(r.reqAt)}</dd></dl>
      ${wrong?`<div class="alert warn">สไลด์นี้เป็นของวอร์ด ${esc(r.ward)} ไม่ใช่วอร์ดของคุณ (${esc(r.myWard)})</div>`:''}
      ${r.status==='in'?'<div id="err"></div><button class="btn btn-blue btn-block" id="v-ok">ยืนยันบันทึกออก</button>':
        `<div class="alert ok">บันทึกออกไปแล้วโดย ${esc(r.recvName)} เมื่อ ${esc(r.recvAt)}</div>`}
    </div>`;
    const ok=$('#v-ok');if(ok)ok.onclick=async()=>{busy(ok,true);
      try{const d=await run('apiCheckOut',store.get(TOKEN_KEY),r.sample);lastDone={kind:'recv',r:d};view='done';render()}
      catch(err){$('#err').innerHTML=`<div class="alert bad">${esc(err.message)}</div>`;busy(ok,false)}};
  };
  inp.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(show,500)});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(timer);show()}});
}
function vDone(){
  const {kind,r}=lastDone;
  app.innerHTML=`<div class="col"><section class="panel done">
    <div class="tick"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></div>
    <h2>${kind==='req'?'บันทึกเข้าแล้ว':'บันทึกออกแล้ว'}</h2>
    <div class="time">${esc(r.time)}</div><div class="small muted">${esc(r.date)}</div>
    <dl class="kv" style="text-align:left"><dt>Sample No.</dt><dd class="mono">${esc(r.sample)}</dd><dt>HN</dt><dd class="mono">${esc(r.hn)}</dd><dt>วอร์ด</dt><dd>${esc(r.ward)}</dd></dl>
    ${kind==='req'?`<p class="small muted" style="margin:0">กลับมารับได้ประมาณ ${LATE_MIN} นาที เช็กสถานะที่หน้าแรกก่อนเดินมา</p>`:''}
    <button class="btn btn-ghost btn-block" id="again">${kind==='req'?'บันทึกเข้าอีกรายการ':'บันทึกออกอีกรายการ'}</button>
    <button class="btn btn-primary btn-block" id="home">กลับหน้าแรก</button></section></div>`;
  $('#again').onclick=()=>{view=kind==='req'?'request':'receive';render()};
  $('#home').onclick=()=>{view='home';render()};
}

/* ---------- lab ---------- */
function vPin(){
  app.innerHTML=`<div class="col"><section class="panel"><h2>ภาพรวม Center Lab</h2>
    <form id="f" class="form" novalidate><div class="field"><label for="pin">PIN ของห้องแล็บ</label>
    <input class="input mono" id="pin" type="password" inputmode="numeric" autocomplete="off"></div>
    <div id="err"></div><button class="btn btn-blue btn-block" type="submit">เข้าหน้าจัดการ</button></form></section></div>`;
  $('#pin').focus();
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');busy(b,true,'กำลังตรวจสอบ…');
    try{labRows=await run('apiLabList',$('#pin').value);labPin=$('#pin').value;try{sessionStorage.setItem('cbcLabPin',labPin)}catch(x){}renderLab()}
    catch(err){$('#err').innerHTML=`<div class="alert bad">${esc(err.message)}</div>`;busy(b,false)}};
}
async function reloadLab(){try{labRows=await run('apiLabList',labPin);if(mode==='lab')renderLab()}catch(err){toast(err.message)}}
function renderLab(){
  const c=k=>labRows.filter(r=>r.status===k).length;
  if(labFilter!=='in'&&labFilter!=='out')labFilter='in';
  let rows=labRows.filter(r=>r.status===labFilter);
  const q=labQ.trim().toLowerCase();
  if(q)rows=rows.filter(r=>[r.sample,r.hn,r.ward,r.reqName].join(' ').toLowerCase().includes(q));
  rows.sort((a,b)=>labFilter==='in'?a.reqTs-b.reqTs:b.recvTs-a.recvTs);
  const stat=(k,n,l)=>`<button class="stat" data-f="${k}" aria-pressed="${labFilter===k}"><div class="n">${n}</div><div class="l">${l}</div></button>`;
  app.innerHTML=`<div class="wide">
   <div class="stats">${stat('in',c('in'),'ตามแล้ว ยังไม่รับ')}${stat('out',c('out'),'รับแล้ว (3 วันล่าสุด)')}</div>
   <div class="toolbar"><input class="input" id="lab-q" placeholder="ค้นหา Sample No., HN, วอร์ด, ชื่อ" value="${esc(labQ)}">
     <button class="btn btn-ghost" id="lab-refresh">รีเฟรช</button>
     <span class="small muted">${labFilter==='in'?`แดง = ตามมาเกิน ${LATE_MIN} นาทีแล้วยังไม่มารับ · `:''}รีเฟรชเองทุก 1 นาที</span></div>
   <div class="tbl-wrap"><table><thead><tr><th>Sample No.</th><th>HN</th><th>วอร์ด</th><th>เข้า: ผู้ตาม / เวลา</th><th>ออก: ผู้รับ / เวลา</th><th>${labFilter==='in'?'ตามมาแล้ว':'ใช้เวลา'}</th></tr></thead><tbody>
   ${rows.length?rows.map(r=>{const m=Math.round(((r.recvTs||Date.now())-r.reqTs)/60000);
     const late=r.status==='in'&&m>LATE_MIN;
     return `<tr><td class="mono">${esc(r.sample)}</td><td class="mono">${esc(r.hn)}</td><td>${esc(r.ward)}</td>
       <td>${esc(r.reqName)}<br><span class="small muted">${esc(r.reqAt)}</span></td>
       <td>${r.status==='out'?`${esc(r.recvName)}<br><span class="small muted">${esc(r.recvAt)}</span>`:'<span class="muted">–</span>'}</td>
       <td class="${late?'late':''}">${dur(m)}</td></tr>`}).join(''):'<tr><td colspan="6" class="muted" style="text-align:center;padding:28px">ไม่มีรายการในกลุ่มนี้</td></tr>'}
   </tbody></table></div></div>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{labFilter=b.dataset.f;renderLab()});
  $('#lab-refresh').onclick=reloadLab;
  const qi=$('#lab-q');qi.oninput=()=>{labQ=qi.value;const p=qi.selectionStart;renderLab();const n=$('#lab-q');n.focus();n.setSelectionRange(p,p)};
}

/* ---------- start ---------- */
$('#mode-ward').onclick=()=>{mode='ward';if(view==='done')view='home';render()};
$('#mode-lab').onclick=async()=>{mode='lab';if(!labPin){try{labPin=sessionStorage.getItem('cbcLabPin')||''}catch(e){}}
  if(labPin){app.innerHTML='<div class="loading">กำลังโหลด…</div>';try{labRows=await run('apiLabList',labPin)}catch(e){labPin=''}}render()};
setInterval(()=>{if(mode==='lab'&&labPin&&document.activeElement&&document.activeElement.id!=='lab-q')reloadLab()},60000);

run('apiInit',store.get(TOKEN_KEY)).then(d=>{WARDS=d.wards;ME=d.me;LATE_MIN=d.lateMin;view=ME?'home':'register';render()})
  .catch(err=>{app.innerHTML=`<div class="col"><div class="alert bad">โหลดไม่สำเร็จ: ${esc(err.message)}</div></div>`});
})();
</script>
</body>
</html>
